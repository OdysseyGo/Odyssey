services:
  db:
    image: postgres:16
    container_name: odyssey_db
    restart: unless-stopped
    env_file: .env
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - odyssey_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: odyssey_backend
    env_file: .env
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.base
      - DB_HOST=${DB_HOST:-db}
      - DB_PORT=${DB_PORT:-5432}
      - ENV_MODE=${ENV_MODE:-development}
      - SECURE_SSL_REDIRECT=False
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
    networks:
      - odyssey_net

networks:
  odyssey_net:

volumes:
  pg_data:
