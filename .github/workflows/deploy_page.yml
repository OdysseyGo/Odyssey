name: Deploy Docusaurus to GitHub Pages

on:
  push:
    branches:
      - KAN-50-Github-page-management 

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website/odyssey-website
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'website/odyssey-website/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Build website
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'website/odyssey-website/build' # Docusaurus outputs static files to the /build directory

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4